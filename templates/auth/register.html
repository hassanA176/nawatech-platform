{% extends "base.html" %}
{% block title %}إنشاء حساب جديد - نواتك{% endblock %}
{% block content %}
<div class="container-fluid">
    <div class="row min-vh-100">
        <!-- Left Panel - Registration Form -->
        <div class="col-lg-6 col-md-7 d-flex align-items-center justify-content-center">
            <div class="register-form-container" style="width: 100%; max-width: 450px; padding: 2rem;">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-dark mb-2">انضم إلى نواتك</h2>
                    <p class="text-muted fw-bold">ابدأ رحلتك الريادية معنا اليوم</p>
                </div>

                <form method="POST" class="register-form">
                    <div class="row">
                        <div class="col-12 mb-3">
                            <label class="fw-bold text-dark mb-1">الاسم الكامل *</label>
                            <input type="text" class="form-control form-control-lg" name="full_name" required>
                        </div>
                        <div class="col-12 mb-3">
                            <label class="fw-bold text-dark mb-1">البريد الإلكتروني *</label>
                            <input type="email" class="form-control form-control-lg" name="email" required>
                        </div>
                        <div class="col-12 mb-3">
                            <label class="fw-bold text-dark mb-1">رقم الهاتف</label>
                            <input type="tel" class="form-control form-control-lg" name="phone">
                        </div>
                        <div class="col-12 mb-3">
                            <label class="fw-bold text-dark mb-1">نوع الحساب *</label>
                            <select class="form-select form-select-lg fw-bold" name="role" required>
                                <option value="Founder">رائد أعمال (صاحب فكرة)</option>
                                <option value="Trainer">مدرب معتمد</option>
                                <option value="Advisor">مستشار خبير</option>
                                <option value="Investor" class="text-success">جهة تمويل (مستثمر)</option>
                            </select>
                        </div>
                        <div class="col-12 mb-3">
                            <label class="fw-bold text-dark mb-1">المحافظة *</label>
                            <select class="form-select form-select-lg fw-bold" name="city" required>
                                <option value="" disabled selected>اختر المحافظة...</option>
                                <option value="بغداد">بغداد (Baghdad)</option>
                                <option value="نينوى">نينوى (Nineveh)</option>
                                <option value="البصرة">البصرة (Basra)</option>
                                <option value="أربيل">أربيل (Erbil)</option>
                                <option value="السليمانية">السليمانية (Sulaymaniyah)</option>
                                <option value="بابل">بابل (Babil)</option>
                                <option value="ذي قار">ذي قار (Dhi Qar)</option>
                                <option value="الأنبار">الأنبار (Anbar)</option>
                                <option value="ديالى">ديالى (Diyala)</option>
                                <option value="كركوك">كركوك (Kirkuk)</option>
                                <option value="النجف">النجف (Najaf)</option>
                                <option value="كربلاء">كربلاء (Karbala)</option>
                                <option value="واسط">واسط (Wasit)</option>
                                <option value="صلاح الدين">صلاح الدين (Salah Al-Din)</option>
                                <option value="القادسية">القادسية / الديوانية (Al-Qadisiyyah)</option>
                                <option value="ميسان">ميسان (Maysan)</option>
                                <option value="المثنى">المثنى / السماوة (Al-Muthanna)</option>
                                <option value="دهوك">دهوك (Duhok)</option>
                                <option value="حلبجة">حلبجة (Halabja)</option>                            </select>
                        </div>
                        <div class="col-12 mb-4">
                            <label class="fw-bold text-dark mb-1">كلمة المرور *</label>
                            <input type="password" class="form-control form-control-lg" name="password" required minlength="6">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-lg fw-bold mb-3 shadow-sm">
                        <i class="fas fa-user-plus me-2"></i> إنشاء الحساب
                    </button>
                    <div class="text-center">
                        <p class="text-dark fw-bold mb-0">لديك حساب بالفعل؟ <a href="{{ url_for('auth.login') }}" class="text-primary text-decoration-none">سجل دخولك</a></p>
                    </div>
                </form>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="col-lg-6 col-md-5 d-none d-md-flex align-items-center justify-content-center features-panel" style="background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);">
            <div class="text-center text-white p-5">
                <i class="fas fa-graduation-cap fa-4x mb-4"></i>
                <h3 class="fw-bold mb-3">منظومة ريادية متكاملة</h3>
                <p class="fs-5">تدريب، إرشاد، وتمويل.. كل ما تحتاجه في مكان واحد.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
