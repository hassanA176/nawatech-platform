<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات النظام - نواتك</title>
    
    <!-- Bootstrap 5 RTL -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts Arabic -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #1a237e;
            --primary-light: #3949ab;
            --secondary: #f50057;
            --accent: #00e676;
            --success: #4caf50;
            --warning: #ff9800;
            --background: #f8faff;
            --gradient-primary: linear-gradient(135deg, #1a237e 0%, #3949ab 50%, #5c6bc0 100%);
            --gradient-secondary: linear-gradient(135deg, #f50057 0%, #ff4081 50%, #ff80ab 100%);
            --gradient-surface: linear-gradient(145deg, #ffffff 0%, #f5f7fa 100%);
            --shadow-1: 0 2px 4px rgba(26, 35, 126, 0.1);
            --shadow-2: 0 4px 8px rgba(26, 35, 126, 0.15);
            --shadow-3: 0 8px 16px rgba(26, 35, 126, 0.2);
            --border-radius: 16px;
            --border-radius-sm: 8px;
        }
        
        * { font-family: 'Tajawal', sans-serif; }
        
        body {
            background: var(--background);
            color: var(--primary);
            line-height: 1.7;
        }
        
        .navbar {
            background: var(--gradient-primary) !important;
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow-2);
            padding: 1.2rem 0;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }
        
        .navbar-brand {
            font-weight: 800;
            font-size: 1.8rem;
            color: white !important;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .card {
            border: none;
            border-radius: var(--border-radius);
            background: var(--gradient-surface);
            box-shadow: var(--shadow-1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            position: relative;
            margin-bottom: 2rem;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gradient-primary);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-3);
        }
        
        .card:hover::before {
            opacity: 1;
        }
        
        .card-header {
            background: linear-gradient(135deg, #f8faff 0%, #e8eaf6 100%);
            border-bottom: 1px solid rgba(26, 35, 126, 0.1);
            border-radius: var(--border-radius) var(--border-radius) 0 0 !important;
            font-weight: 700;
            padding: 1.5rem 2rem;
            color: var(--primary);
        }
        
        .card-body {
            padding: 2rem;
        }
        
        .btn {
            font-weight: 600;
            padding: 0.875rem 2rem;
            border-radius: var(--border-radius);
            border: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: none;
            font-size: 1rem;
            position: relative;
            overflow: hidden;
        }
        
        .btn-primary {
            background: var(--gradient-primary);
            color: white;
            box-shadow: var(--shadow-2);
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-3);
            background: var(--gradient-primary);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #4caf50 0%, #66bb6a 100%);
            color: white;
            box-shadow: var(--shadow-2);
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #ff9800 0%, #ffb74d 100%);
            color: white;
            box-shadow: var(--shadow-2);
        }
        
        .btn-info {
            background: linear-gradient(135deg, #2196f3 0%, #42a5f5 100%);
            color: white;
            box-shadow: var(--shadow-2);
        }
        
        .btn-outline-light {
            border: 2px solid rgba(255, 255, 255, 0.8);
            color: white;
            background: transparent;
        }
        
        .btn-outline-light:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            transform: translateY(-2px);
        }
        
        .form-control, .form-select {
            border: 2px solid rgba(26, 35, 126, 0.1);
            border-radius: var(--border-radius-sm);
            padding: 1rem 1.5rem;
            transition: all 0.3s ease;
            background: var(--gradient-surface);
            font-weight: 400;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(26, 35, 126, 0.1);
            background: white;
        }
        
        .form-label {
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 0.8rem;
        }
        
        .form-check-input {
            border: 2px solid var(--primary);
            border-radius: 6px;
        }
        
        .form-check-input:checked {
            background-color: var(--primary);
            border-color: var(--primary);
        }
        
        .hero-section {
            background: var(--gradient-primary);
            color: white;
            padding: 4rem 0;
            position: relative;
            overflow: hidden;
            margin-bottom: 3rem;
        }
        
        .hero-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="1" fill="white" opacity="0.1"/><circle cx="80" cy="40" r="1" fill="white" opacity="0.1"/><circle cx="40" cy="80" r="1" fill="white" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
            opacity: 0.3;
        }
        
        .hero-content {
            position: relative;
            z-index: 2;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .animate-fade-in-up {
            animation: fadeInUp 0.6s ease forwards;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-rocket me-2"></i> 
                نواتك
            </a>
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-light btn-sm">
                <i class="fas fa-arrow-left me-1"></i>العودة للوحة الإدارة
            </a>
        </div>
    </nav>
    
    <!-- Hero Section -->
    <section class="hero-section" style="margin-top: 80px;">
        <div class="container">
            <div class="hero-content text-center animate-fade-in-up">
                <h1 class="display-4 fw-bold mb-3">
                    <i class="fas fa-cogs me-3"></i>
                    إعدادات النظام المتقدمة
                </h1>
                <p class="lead mb-0">تحكم كامل في إعدادات وأمان المنصة</p>
            </div>
        </div>
    </section>
    
    <!-- Content -->
    <div class="container">
        <div class="row">
            <div class="col-lg-6 mb-4">
                <div class="card animate-fade-in-up">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-sliders-h me-2 text-primary"></i>
                            الإعدادات العامة
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">اسم المنصة</label>
                            <input type="text" class="form-control" value="نواتك">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">البريد الإداري</label>
                            <input type="email" class="form-control" value="admin@rafidain.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">حد التسجيل اليومي</label>
                            <input type="number" class="form-control" value="50">
                        </div>
                        <button class="btn btn-success">
                            <i class="fas fa-save me-2"></i>حفظ الإعدادات
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-6 mb-4">
                <div class="card animate-fade-in-up">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-shield-alt me-2 text-warning"></i>
                            إعدادات الأمان
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" checked id="twoFactor">
                                <label class="form-check-label" for="twoFactor">
                                    تفعيل المصادقة الثنائية
                                </label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" checked id="logging">
                                <label class="form-check-label" for="logging">
                                    تسجيل العمليات
                                </label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">مدة انتهاء الجلسة (دقيقة)</label>
                            <input type="number" class="form-control" value="60">
                        </div>
                        <button class="btn btn-warning">
                            <i class="fas fa-lock me-2"></i>تطبيق إعدادات الأمان
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-12">
                <div class="card animate-fade-in-up">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-database me-2 text-info"></i>
                            إدارة النسخ الاحتياطي
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <button class="btn btn-primary w-100">
                                    <i class="fas fa-download me-2"></i>إنشاء نسخة احتياطية
                                </button>
                            </div>
                            <div class="col-md-4 mb-3">
                                <button class="btn btn-success w-100">
                                    <i class="fas fa-upload me-2"></i>استعادة نسخة احتياطية
                                </button>
                            </div>
                            <div class="col-md-4 mb-3">
                                <button class="btn btn-info w-100">
                                    <i class="fas fa-clock me-2"></i>جدولة النسخ التلقائي
                                </button>
                            </div>
                        </div>
                        <div class="alert alert-info mt-3" role="alert">
                            <i class="fas fa-info-circle me-2"></i>
                            <strong>آخر نسخة احتياطية:</strong> 17/09/2024 - 2:30 ص
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Footer spacing -->
    <div style="height: 100px;"></div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
