        <!DOCTYPE html>
        <html lang="ar" dir="rtl">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>إدارة الصلاحيات -  نواتك</title>
            
            <!-- Bootstrap 5 RTL -->
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
            <!-- Font Awesome -->
            <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
            <!-- Google Fonts Arabic -->
            <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">
            
            <style>
                :root {
                    --primary: #1a237e;
                    --primary-light: #3949ab;
                    --secondary: #f50057;
                    --accent: #00e676;
                    --success: #4caf50;
                    --warning: #ff9800;
                    --background: #f8faff;
                    --gradient-primary: linear-gradient(135deg, #1a237e 0%, #3949ab 50%, #5c6bc0 100%);
                    --gradient-surface: linear-gradient(145deg, #ffffff 0%, #f5f7fa 100%);
                    --shadow-1: 0 2px 4px rgba(26, 35, 126, 0.1);
                    --shadow-2: 0 4px 8px rgba(26, 35, 126, 0.15);
                    --shadow-3: 0 8px 16px rgba(26, 35, 126, 0.2);
                    --border-radius: 16px;
                    --border-radius-sm: 8px;
                }
                
                * { font-family: 'Tajawal', sans-serif; }
                
                body {
                    background: var(--background);
                    color: var(--primary);
                    line-height: 1.7;
                }
                
                .navbar {
                    background: var(--gradient-primary) !important;
                    backdrop-filter: blur(20px);
                    box-shadow: var(--shadow-2);
                    padding: 1.2rem 0;
                    border-bottom: 2px solid rgba(255, 255, 255, 0.1);
                }
                
                .navbar-brand {
                    font-weight: 800;
                    font-size: 1.8rem;
                    color: white !important;
                    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
                }
                
                .card {
                    border: none;
                    border-radius: var(--border-radius);
                    background: var(--gradient-surface);
                    box-shadow: var(--shadow-1);
                    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
                    overflow: hidden;
                    position: relative;
                    margin-bottom: 2rem;
                }
                
                .card:hover {
                    transform: translateY(-8px);
                    box-shadow: var(--shadow-3);
                }
                
                .card-header {
                    font-weight: 700;
                    padding: 1.5rem 2rem;
                    border-radius: var(--border-radius) var(--border-radius) 0 0 !important;
                }
                
                .card-body {
                    padding: 2rem;
                }
                
                .btn {
                    font-weight: 600;
                    padding: 0.875rem 2rem;
                    border-radius: var(--border-radius);
                    border: none;
                    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                    text-transform: none;
                    font-size: 1rem;
                }
                
                .btn:hover {
                    transform: translateY(-3px);
                    box-shadow: var(--shadow-3);
                }
                
                .btn-outline-light {
                    border: 2px solid rgba(255, 255, 255, 0.8);
                    color: white;
                    background: transparent;
                }
                
                .btn-outline-light:hover {
                    background: rgba(255, 255, 255, 0.2);
                    color: white;
                    transform: translateY(-2px);
                }
                
                .form-control, .form-select {
                    border: 2px solid rgba(26, 35, 126, 0.1);
                    border-radius: var(--border-radius-sm);
                    padding: 1rem 1.5rem;
                    transition: all 0.3s ease;
                    background: var(--gradient-surface);
                }
                
                .form-control:focus, .form-select:focus {
                    border-color: var(--primary);
                    box-shadow: 0 0 0 4px rgba(26, 35, 126, 0.1);
                    background: white;
                }
                
                .hero-section {
                    background: var(--gradient-primary);
                    color: white;
                    padding: 4rem 0;
                    position: relative;
                    overflow: hidden;
                    margin-bottom: 3rem;
                }
                
                .hero-section::before {
                    content: '';
                    position: absolute;
                    top: 0;
                    left: 0;
                    right: 0;
                    bottom: 0;
                    background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="1" fill="white" opacity="0.1"/><circle cx="80" cy="40" r="1" fill="white" opacity="0.1"/><circle cx="40" cy="80" r="1" fill="white" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
                    opacity: 0.3;
                }
                
                .hero-content {
                    position: relative;
                    z-index: 2;
                }
                
                @keyframes fadeInUp {
                    from {
                        opacity: 0;
                        transform: translateY(30px);
                    }
                    to {
                        opacity: 1;
                        transform: translateY(0);
                    }
                }
                
                .animate-fade-in-up {
                    animation: fadeInUp 0.6s ease forwards;
                }
            </style>
        </head>
        <body>
            <!-- Navigation -->
            <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
                <div class="container">
                    <a class="navbar-brand" href="/">
                        <i class="fas fa-rocket me-2"></i>
                        نواتك
                    </a>
                    <a href="/dashboard/" class="btn btn-outline-light btn-sm">
                        <i class="fas fa-arrow-left me-1"></i>العودة للوحة الإدارة
                    </a>
                </div>
            </nav>
            
            <!-- Hero Section -->
            <section class="hero-section" style="margin-top: 80px;">
                <div class="container">
                    <div class="hero-content text-center animate-fade-in-up">
                        <h1 class="display-4 fw-bold mb-3">
                            <i class="fas fa-user-shield me-3"></i>
                            إدارة الصلاحيات والأدوار
                        </h1>
                        <p class="lead mb-0">تحكم في صلاحيات المستخدمين وأدوارهم</p>
                    </div>
                </div>
            </section>
            
            <!-- Content -->
            <div class="container">
                <div class="row">
                    <div class="col-lg-3 col-md-6 mb-4">
                        <div class="card animate-fade-in-up">
                            <div class="card-header bg-warning text-dark">
                                <h6 class="mb-0">
                                    <i class="fas fa-crown me-2"></i>صلاحيات المدير
                                </h6>
                            </div>
                            <div class="card-body">
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" checked disabled id="admin1">
                                    <label class="form-check-label" for="admin1">إدارة المستخدمين</label>
                                </div>
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" checked disabled id="admin2">
                                    <label class="form-check-label" for="admin2">إدارة البرامج</label>
                                </div>
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" checked disabled id="admin3">
                                    <label class="form-check-label" for="admin3">مراجعة الطلبات</label>
                                </div>
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" checked disabled id="admin4">
                                    <label class="form-check-label" for="admin4">إعدادات النظام</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-lg-3 col-md-6 mb-4">
                        <div class="card animate-fade-in-up">
                            <div class="card-header bg-success text-white">
                                <h6 class="mb-0">
                                    <i class="fas fa-user-tie me-2"></i>صلاحيات المستشار
                                </h6>
                            </div>
                            <div class="card-body">
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" checked id="advisor1">
                                    <label class="form-check-label" for="advisor1">مراجعة الطلبات</label>
                                </div>
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" checked id="advisor2">
                                    <label class="form-check-label" for="advisor2">إرشاد الشركات</label>
                                </div>
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" id="advisor3">
                                    <label class="form-check-label" for="advisor3">تقييم المشاريع</label>
                                </div>
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" id="advisor4">
                                    <label class="form-check-label" for="advisor4">إضافة تقارير</label>
                                </div>
                                <button class="btn btn-success btn-sm w-100">
                                    <i class="fas fa-save me-1"></i>حفظ التغييرات
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-lg-3 col-md-6 mb-4">
                        <div class="card animate-fade-in-up">
                            <div class="card-header bg-info text-white">
                                <h6 class="mb-0">
                                    <i class="fas fa-chalkboard-teacher me-2"></i>صلاحيات المدرب
                                </h6>
                            </div>
                            <div class="card-body">
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" checked id="trainer1">
                                    <label class="form-check-label" for="trainer1">إدارة الوحدات</label>
                                </div>
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" checked id="trainer2">
                                    <label class="form-check-label" for="trainer2">تدريب الشركات</label>
                                </div>
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" id="trainer3">
                                    <label class="form-check-label" for="trainer3">تقييم التقدم</label>
                                </div>
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" id="trainer4">
                                    <label class="form-check-label" for="trainer4">إنشاء محتوى</label>
                                </div>
                                <button class="btn btn-info btn-sm w-100">
                                    <i class="fas fa-save me-1"></i>حفظ التغييرات
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-lg-3 col-md-6 mb-4">
                        <div class="card animate-fade-in-up">
                            <div class="card-header bg-primary text-white">
                                <h6 class="mb-0">
                                    <i class="fas fa-rocket me-2"></i>صلاحيات رائد الأعمال
                                </h6>
                            </div>
                            <div class="card-body">
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" checked disabled id="founder1">
                                    <label class="form-check-label" for="founder1">التقديم للبرامج</label>
                                </div>
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" checked disabled id="founder2">
                                    <label class="form-check-label" for="founder2">إدارة المشاريع</label>
                                </div>
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" checked id="founder3">
                                    <label class="form-check-label" for="founder3">التواصل مع المرشدين</label>
                                </div>
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" checked id="founder4">
                                    <label class="form-check-label" for="founder4">الوصول للموارد</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Add New Role -->
                <div class="row">
                    <div class="col-12">
                        <div class="card animate-fade-in-up">
                            <div class="card-header">
                                <h5 class="mb-0">
                                    <i class="fas fa-plus-circle me-2 text-primary"></i>
                                    إضافة دور جديد
                                </h5>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-4 mb-3">
                                        <input type="text" class="form-control" placeholder="اسم الدور الجديد">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <input type="text" class="form-control" placeholder="وصف الدور">
                                    </div>
                                    <div class="col-md-2 mb-3">
                                        <button class="btn btn-primary w-100">
                                            <i class="fas fa-plus me-1"></i>إضافة دور
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Footer spacing -->
            <div style="height: 100px;"></div>
            
            <!-- Bootstrap JS -->
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        </body>
        </html>
