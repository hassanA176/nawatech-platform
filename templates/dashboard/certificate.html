{% extends "base.html" %}
{% block content %}
<div class="container mt-5 mb-5">
    <div class="text-center mb-4">
        <button onclick="window.print()" class="btn btn-dark fw-bold px-4"><i class="fas fa-print me-2"></i> طباعة الشهادة</button>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-secondary fw-bold px-4 ms-2">العودة</a>
    </div>

    <!-- حاوية الشهادة مع الصورة كخلفية -->
    <div class="certificate-container mx-auto position-relative" style="max-width: 800px; height: 600px; background: url('/static/certificate.svg') no-repeat center center; background-size: cover; border: 5px solid #1a237e; box-shadow: 0 10px 30px rgba(0,0,0,0.2);">
        
        <!-- اسم المتدرب (مضبوط في المنتصف تقريباً) -->
        <div class="position-absolute w-100 text-center" style="top: 42%;">
            <h1 class="fw-bold" style="color: #1a237e; font-size: 3rem; font-family: 'Tajawal', sans-serif;">{{ app.startup.owner.full_name }}</h1>
        </div>

        <!-- اسم المشروع -->
        <div class="position-absolute w-100 text-center" style="top: 55%;">
            <h3 class="fw-bold" style="color: #424242;">عن مشروع: {{ app.startup.name }}</h3>
        </div>

        <!-- التاريخ -->
        <div class="position-absolute" style="bottom: 12%; right: 15%;">
            <h5 class="fw-bold" style="color: #1a237e;">{{ today }}</h5>
        </div>
    </div>
</div>
{% endblock %}
