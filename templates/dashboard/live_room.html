<!DOCTYPE html>
<html>
<head>
    <title>غرفة الاجتماع المباشر</title>
    <script src='https://meet.jit.si/external_api.js'></script>
    <style>body, html { margin: 0; padding: 0; height: 100%; }</style>
</head>
<body>
    <div id="meet" style="height: 100vh; width: 100vw;"></div>
    <script>
        const domain = 'meet.jit.si';
        const options = {
            roomName: '{{ room_name }}',
            width: '100%', height: '100%',
            parentNode: document.querySelector('#meet'),
            userInfo: { displayName: '{{ user_name }}' },
            configOverwrite: { startWithAudioMuted: true, startWithVideoMuted: false },
            interfaceConfigOverwrite: { filmStripOnly: false }
        };
        const api = new JitsiMeetExternalAPI(domain, options);
    </script>
</body>
</html>
